{% extends "base.html" %}
{% block title %}CS-Market 单品分析{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔍 单品分析</h1>
  <div class="page-sub">输入饰品名称直接分析</div>
</div>

<div class="card" style="padding:16px;">
  <form id="search-form" hx-post="/api/items/search" hx-target="#modal-body" hx-swap="innerHTML" hx-indicator="#search-spinner" onsubmit="showLoadingAndOpen()" style="gap:8px;display:flex;">
    <input type="text" id="search-input" name="query" placeholder="输入饰品名称..." class="form-input" style="flex:1;" required minlength="2" autofocus value="{{ query }}">
    <button type="submit" class="btn btn-primary">
      <span class="htmx-indicator spinner" id="search-spinner"></span>
      🔍 分析
    </button>
  </form>
  <div class="htmx-indicator" style="margin-top:8px;font-size:12px;color:var(--text-muted);">
    ⏳ 正在搜索和分析，预计 30-50 秒，请耐心等待...
  </div>
</div>

<div id="search-results" style="margin-top:16px;">
  <div class="card"><div class="empty-state" style="text-align:center;padding:40px;color:var(--text-muted);">输入关键词开始分析</div></div>
</div>

{% include 'partials/analysis_results.html' %}
{% endblock %}

{% block scripts %}
<script>
function showLoadingAndOpen() {
  document.getElementById("modal-body").innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto 16px;width:32px;height:32px;"></div><p style="color:var(--text-muted);font-size:14px;">正在分析中，请耐心等待...</p></div>';
  openModal("analysis-modal");
}

function viewReportHtml(btn) {
  var id = btn.getAttribute("data-report");
  var el = document.getElementById("report-data-" + id);
  if (el) {
        document.getElementById("modal-body").innerHTML = '';
    var content = el.content ? el.content.cloneNode(true) : el.innerHTML;
    document.getElementById("modal-body").appendChild(content);
    openModal("analysis-modal");
  }
}


function reanalyzeItem(name) {
  document.getElementById("search-input").value = name;
  document.getElementById("search-form").requestSubmit();
}

(function() {
  var q = new URLSearchParams(window.location.search).get("q");
  if (q && q.trim().length >= 2) {
    // 等 DOMContentLoaded: analysis-modal 在 scripts block 之后，需等模态解析完成才能开启
    document.addEventListener("DOMContentLoaded", function() {
      var input = document.getElementById("search-input");
      if (!input) return;
      input.value = q;
      var form = document.getElementById("search-form");
      if (form) form.requestSubmit();
    });
  }
})();

</script>
{% endblock %}

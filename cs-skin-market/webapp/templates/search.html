{% extends "base.html" %}
{% block title %}CS-Market 单品分析{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔍 单品分析</h1>
  <div class="page-sub">输入饰品名称直接分析</div>
</div>

<div class="card card-pad">
  <form id="search-form" class="row-flex" hx-post="/api/items/search" hx-target="#modal-body" hx-swap="innerHTML" hx-indicator="#search-spinner" onsubmit="showLoadingAndOpen()">
    <input type="text" id="search-input" name="query" placeholder="输入饰品名称..." class="form-input flex-1" required minlength="2" autofocus value="{{ query }}">
    <button type="submit" class="btn btn-primary">
      <span class="htmx-indicator spinner" id="search-spinner"></span>
      🔍 分析
    </button>
  </form>
  <div class="htmx-indicator mt-8 text-12 muted">
    ⏳ 正在搜索和分析，预计 30-50 秒，请耐心等待...
  </div>
</div>

<div id="search-results" class="mt-16">
  <div class="card"><div class="empty-state">输入关键词开始分析</div></div>
</div>

{% include 'partials/analysis_results.html' %}
{% endblock %}

{% block scripts %}
<script>
function showLoadingAndOpen() {
  document.getElementById("modal-body").innerHTML = '<div class="loading-hint"><div class="spinner spinner-lg"></div><p class="muted text-14">正在分析中，请耐心等待...</p></div>';
  openModal("analysis-modal");
}

function viewReportHtml(btn) {
  var id = btn.getAttribute("data-report");
  var el = document.getElementById("report-data-" + id);
  if (el) {
        document.getElementById("modal-body").innerHTML = '';
    var content = el.content ? el.content.cloneNode(true) : el.innerHTML;
    document.getElementById("modal-body").appendChild(content);
    openModal("analysis-modal");
  }
}


function reanalyzeItem(name) {
  document.getElementById("search-input").value = name;
  document.getElementById("search-form").requestSubmit();
}

(function() {
  var q = new URLSearchParams(window.location.search).get("q");
  if (q && q.trim().length >= 2) {
    // 等 DOMContentLoaded: analysis-modal 在 scripts block 之后，需等模态解析完成才能开启
    document.addEventListener("DOMContentLoaded", function() {
      var input = document.getElementById("search-input");
      if (!input) return;
      input.value = q;
      var form = document.getElementById("search-form");
      if (form) form.requestSubmit();
    });
  }
})();

// 分析完成后刷新下方"分析结果"列表（中途关闭弹窗后仍可从列表查看报告）
document.addEventListener('htmx:afterSwap', function(evt) {
  var pi = evt.detail && evt.detail.pathInfo;
  if (!pi || pi.requestPath !== '/api/items/search') return;
  fetch('/api/analysis/results')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      var sec = document.getElementById('analysis-results-section');
      if (!sec || !html) return;
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      var fresh = tmp.querySelector('#analysis-results-section');
      if (fresh) sec.replaceWith(fresh);
    })
    .catch(function() {});
});

</script>
{% endblock %}

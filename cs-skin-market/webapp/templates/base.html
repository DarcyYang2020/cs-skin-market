<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CS-Market{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css?v=7">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script defer src="/static/js/app.js?v=7"></script>
{% block head %}{% endblock %}
</head>
<body>
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">C</div>
      <span>CS-Market</span>
    </div>
    <div class="sidebar-nav">
      <div class="nav-label">市场分析</div>
      <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">📊</span> 大盘
      </a>
      <a href="/search" class="{% if active_page == 'search' %}active{% endif %}">
        <span class="nav-icon">🔍</span> 单品分析
      </a>
      <a href="/watchlist" class="{% if active_page == 'watchlist' %}active{% endif %}">
        <span class="nav-icon">⭐</span> 持仓管理
      </a>
      <a href="/discover" class="{% if active_page == 'discover' %}active{% endif %}">
        <span class="nav-icon">🏆</span> 发现高分品
      </a>
      <a href="/replay" class="{% if active_page == 'replay' %}active{% endif %}">
        <span class="nav-icon">📊</span> 信号复盘
      </a>
          </div>
    <div class="sidebar-footer">v3.0 · csQAQ</div>
  </div>

  <!-- Right Content -->
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>

  <div id="toast-container"></div>
  {% block scripts %}{% endblock %}


  <!-- Confirm Modal (replaces native confirm) -->
  <div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width:400px;">
      <h3 style="margin-bottom:8px;">⚠️ 确认操作</h3>
      <p id="confirm-message" style="color:var(--text-secondary);font-size:14px;margin:8px 0 20px;line-height:1.6;"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeConfirmModal(false)">取消</button>
        <button type="button" class="btn btn-danger" onclick="closeConfirmModal(true)">确认</button>
      </div>
    </div>
  </div>
  <!-- Global Analysis Modal -->
  <div id="analysis-modal" class="modal-overlay" style="display:none;">
    <div class="modal-container">
      <div class="modal-header-bar">
        <span class="modal-title-text">📊 分析报告</span>
        <button class="modal-close-btn" onclick="closeModal('analysis-modal')">✕</button>
      </div>
      <div class="modal-body-scroll" id="modal-body"></div>
    </div>
<script>
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.display = 'none';
}
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    closeModal(e.target.id);
  }
});
</script>
</body>
</html>

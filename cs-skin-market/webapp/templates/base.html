<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CS-Market{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css?v=5">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script defer src="/static/js/app.js?v=5"></script>
{% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="logo-dot"></span>
      CS-Market
    </a>
    <div class="navbar-nav">
      <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">📊 大盘</a>
      <a href="/search" class="{% if active_page == 'search' %}active{% endif %}">🔍 搜索</a>
      <a href="/watchlist" class="{% if active_page == 'watchlist' %}active{% endif %}">⭐ 自选</a>
      {% block nav_extra %}{% endblock %}
    </div>
  </nav>
  <div class="main-container">
    {% block content %}{% endblock %}
  </div>
  <div id="toast-container"></div>
  {% block scripts %}{% endblock %}

<!-- Global Analysis Modal -->
<div id="analysis-modal" class="modal-overlay" style="display:none;">
  <div class="modal-container modal-xl">
    <div class="modal-header-bar">
      <span class="modal-title-text">📊 分析报告</span>
      <button class="modal-close-btn" onclick="closeModal('analysis-modal')">✕</button>
    </div>
    <div class="modal-body-scroll" id="modal-body">
      <!-- HTMX 分析/报告内容载入此处 -->
    </div>
  </div>
</div>
</body>
</html>

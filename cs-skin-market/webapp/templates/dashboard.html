{% extends "base.html" %}
{% block title %}CS-Market 大盘{% endblock %}

{% block content %}
<div id="dashboard-content" class="page-dashboard">
{% include "partials/index_card.html" %}
{% include "partials/index_analysis.html" %}
</div>

<!-- 数据健康 (A1, 2026-08-05): run_health_monitor 自动检查结果, 每日采集收尾/手动触发写 health_checks -->
<div class="card" id="health-card" style="display:none;margin-top:16px;">
  <div class="card-header">
    <span class="card-title">🩺 数据健康</span>
    <span id="health-time" style="font-size:12px;color:var(--text-muted);"></span>
    <button class="btn btn-outline btn-sm" onclick="loadHealth()" style="margin-left:auto;">🔄 刷新</button>
  </div>
  <div id="health-body" style="padding:10px 14px;font-size:13px;"></div>
</div>

<!-- 信号中心 (2026-08-05): 最近一次批量扫描信号摘要 -->
<div class="card" id="signal-center" style="display:none;margin-top:16px;">
  <div class="card-header">
    <span class="card-title">🔔 信号中心</span>
    <span id="signal-time" style="font-size:12px;color:var(--text-muted);"></span>
  </div>
  <div id="signal-list" style="padding:10px 14px;font-size:13px;color:var(--text-secondary);"></div>
</div>

<!-- 数据积累进度 (P0-3, 2026-08-04) -->
<div class="card" id="data-progress-card" style="display:none;margin-top:16px;">
  <div class="card-header">
    <span class="card-title">📊 数据积累进度</span>
    <span id="data-progress-time" style="font-size:12px;color:var(--text-muted);"></span>
  </div>
  <div id="data-progress-body" style="padding:12px 14px;font-size:13px;color:var(--text-secondary);"></div>
</div>

<!-- 引擎回测对比 (2026-08-07): 新旧引擎演进 + 基准对照 + 关键节点 -->
<div class="card" id="engine-compare-card" style="display:none;margin-top:16px;">
  <div class="card-header">
    <span class="card-title">🧪 引擎回测对比</span>
    <button class="btn btn-outline btn-sm" onclick="loadEngineCompare()" style="margin-left:auto;">🔄 刷新</button>
  </div>
  <div id="engine-compare-body" style="padding:12px 14px;font-size:13px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ---- 数据健康 (A1, 2026-08-05): 实时检查 + 自动检查状态 + 明细（接口异常也显示，不静默隐藏） ----
function _healthBadge(st, label) {
  var colors = {pass: "var(--green)", warn: "var(--yellow)", fail: "var(--red)"};
  var color = colors[st] || "var(--text-muted)";
  return '<span class="badge" style="background:rgba(255,255,255,0.08);color:' + color + ';font-weight:700;">' + label + '</span>';
}
function renderHealth(d) {
  var st = d.status || "pass";
  var la = d.last_auto;
  var autoHtml = la && la.created_at
    ? _healthBadge(la.status, (la.status === "pass" ? "自动通过" : "自动异常") + " " + la.created_at)
    : '<span style="font-size:11px;color:var(--text-muted);">无自动检查记录</span>';
  var html = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'
    + _healthBadge(st, st === "pass" ? "实时检查 · 正常" : "实时检查 · 异常")
    + '<span style="font-size:11px;color:var(--text-muted);">数据日期 ' + (d.data_date || "--") + '</span>'
    + autoHtml
    + '</div>';
  var checks = d.checks || [];
  html += '<div style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;">'
    + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:2px;">检查明细（' + checks.length + ' 项）</div>'
    + '<table style="width:100%;font-size:12px;"><tbody>';
  checks.forEach(function(x) {
    var ok = x.level === "PASS";
    html += '<tr><td style="width:120px;padding:2px 0;white-space:nowrap;color:' + (ok ? "var(--text-secondary)" : "var(--red)") + ';">'
      + (ok ? "✅ " : "❌ ") + x.name + '</td>'
      + '<td style="padding:2px 0;color:var(--text-muted);">' + x.detail + '</td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById("health-body").innerHTML = html;
}
function loadHealth() {
  var card = document.getElementById("health-card");
  if (!card) return;
  fetch("/api/health/status")
  .then(function(r) { return r.json(); })
  .then(function(d) {
    card.style.display = "block";
    if (!d.found) {
      document.getElementById("health-time").textContent = "";
      document.getElementById("health-body").innerHTML = '<div style="color:var(--red);">健康检查不可用：' + (d.error || "未知错误") + '</div>';
      return;
    }
    document.getElementById("health-time").textContent = "实时 " + (d.checked_at || "--");
    renderHealth(d);
  })
  .catch(function(e) {
    card.style.display = "block";
    document.getElementById("health-time").textContent = "";
    document.getElementById("health-body").innerHTML = '<div style="color:var(--red);">健康检查接口暂不可用：' + e + '</div>';
  });
}
loadHealth();

// ---- 引擎回测对比 (2026-08-07): 新旧引擎演进 + 基准对照 + 关键节点 ----
function loadEngineCompare() {
  var card = document.getElementById("engine-compare-card");
  if (!card) return;
  fetch("/api/engine/compare")
  .then(function(r) { return r.json(); })
  .then(function(d) {
    card.style.display = "block";
    var body = document.getElementById("engine-compare-body");
    if (!d.ok) { body.innerHTML = '<div style="color:var(--red);">' + (d.error || "接口异常") + '</div>'; return; }
    var html = '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">引擎演进（96 品池 · 2025-01-01~2026-08-05 · warmup30 · 成本2%）</div>';
    html += '<table style="width:100%;font-size:12px;"><thead><tr>' + ["版本","信号","14d胜率","14d均收益","加权14d","30d胜率","30d均收益"].map(function(h){ return '<th style="text-align:left;padding:2px 6px;color:var(--text-muted);">' + h + '</th>'; }).join("") + '</tr></thead><tbody>';
    (d.evolution || []).forEach(function(e) {
      var cur = e.key === "devol_v2";
      html += '<tr style="' + (cur ? 'background:rgba(34,197,94,0.08);' : '') + '">'
        + '<td style="padding:2px 6px;">' + e.label + '<div style="font-size:10px;color:var(--text-muted);">' + e.signals + '信号 · ' + (e.range || "") + '</div></td>'
        + '<td style="padding:2px 6px;' + (cur ? 'color:#4ade80;font-weight:700;' : '') + '">' + (e.win14_pct != null ? e.win14_pct + '%' : "--") + '</td>'
        + '<td style="padding:2px 6px;">' + (e.avg14 != null ? e.avg14 : "--") + '</td>'
        + '<td style="padding:2px 6px;">' + (e.wavg14 != null ? e.wavg14 : "--") + '</td>'
        + '<td style="padding:2px 6px;">' + (e.win30_pct != null ? e.win30_pct + '%' : "--") + '</td>'
        + '<td style="padding:2px 6px;">' + (e.avg30 != null ? e.avg30 : "--") + '</td></tr>';
    });
    html += '</tbody></table>';
    var l88 = d.legacy_88 || {};
    if (l88.signals) {
      html += '<div style="margin-top:6px;font-size:11px;color:var(--text-muted);">旧引擎官方 88 基准（已删除归档）：' + l88.signals + ' 信号 · 14d ' + l88.win14_pct + '% · 30d ' + l88.win30_pct + '% · ' + (l88.range || "") + ' —— ' + (l88.note || "") + '</div>';
    }
    var b = (d.benchmark && d.benchmark.windows && d.benchmark.windows.active) || {};
    if (b.strategy) {
      html += '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">v2 策略 vs 基准（活跃窗口 ' + (b.range ? b.range.join(" ~ ") : "") + '）</div>';
      html += '<table style="width:100%;font-size:12px;"><tbody>';
      [["v2 策略", b.strategy], ["池内等权买入持有", b.pool_buy_hold], ["大盘指数", b.market_index]].forEach(function(r) {
        var st = r[1] || {};
        html += '<tr><td style="padding:2px 6px;width:120px;color:var(--text-muted);">' + r[0] + '</td>'
          + '<td style="padding:2px 6px;">累计 ' + st.total_return_pct + '%</td>'
          + '<td style="padding:2px 6px;">最大回撤 ' + st.max_drawdown_pct + '%</td>'
          + '<td style="padding:2px 6px;">年化 ' + (st.annualized_pct == null ? "--" : st.annualized_pct + "%") + '</td></tr>';
      });
      html += '</tbody></table>';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + (d.benchmark.note || "") + '</div></div>';
    }
    if (d.families && d.families.length) {
      html += '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">信号族分布（当前引擎）</div>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + d.families.map(function(f) {
        return '<span style="padding:3px 8px;border-radius:4px;background:rgba(100,116,139,0.15);color:#94a3b8;">' + f.label + ' ' + f.n + '</span>';
      }).join("") + '</div></div>';
    }
    var nodes = (d.nodes || []).concat(d.milestones || []).sort(function(a, b) { return a.date < b.date ? -1 : 1; });
    if (nodes.length) {
      html += '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">关键节点</div>';
      nodes.forEach(function(n) {
        html += '<div style="display:flex;gap:8px;margin-bottom:4px;font-size:12px;"><span style="color:#fbbf24;white-space:nowrap;">' + n.date + '</span><span><b>' + n.title + '</b> — ' + n.detail + '</span></div>';
      });
      html += '</div>';
    }
    body.innerHTML = html;
  })
  .catch(function(e) {
    card.style.display = "block";
    document.getElementById("engine-compare-body").innerHTML = '<div style="color:var(--red);">引擎对比接口暂不可用：' + e + '</div>';
  });
}
loadEngineCompare();

// ---- 信号中心 (2026-08-05): 复用 watchlist 扫描信号数据源 ----
fetch("/api/watchlist/scan-history")
.then(function(r) { return r.json(); })
.then(function(d) {
  var sc = document.getElementById("signal-center");
  if (!sc || !d.found) return;
  var signals = d.latest_signals || [];
  sc.style.display = "block";
  document.getElementById("signal-time").textContent = d.scans && d.scans.length ? "上次扫描 " + d.scans[0].time : "";
  if (!signals.length) {
    document.getElementById("signal-list").innerHTML = "暂无触发信号（已到买点 / 可补仓 / 建议止损）；去「自选」页批量扫描获取最新信号。";
    return;
  }
  var rows = signals.map(function(s) {
    var gapTxt = (s.gap_pct !== null && s.gap_pct !== undefined) ? "距买点还差 " + s.gap_pct + "%" : "";
    if (s.pnl_pct !== null && s.pnl_pct !== undefined) gapTxt += (gapTxt ? " · " : "") + "浮亏" + Math.abs(s.pnl_pct) + "%";
    var color = "var(--accent)";
    if (s.action === "可分批补仓" || s.action === "已到买点") color = "var(--green)";
    if (s.action === "建议止损" || s.action === "接近止损位") color = "var(--red)";
    if (s.action === "浮盈可观·考虑止盈") color = "var(--yellow)";
    return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;">'
      + '<span style="font-weight:600;">' + s.name + '</span>'
      + '<span class="badge" style="background:rgba(255,255,255,0.08);color:' + color + ';">' + (s.holding ? "持仓·" : "") + s.action + '</span>'
      + '<span style="font-size:11px;color:var(--text-muted);">' + gapTxt + '</span>'
      + '<span style="font-size:11px;color:var(--text-muted);">' + (s.suggest || "") + '</span>'
      + '</div>';
  }).join("");
  document.getElementById("signal-list").innerHTML = rows;
});

function _dpFmt(s) { return s ? String(s).slice(0, 10) : "--"; }
fetch("/api/data/progress")
.then(function(r) { return r.json(); })
.then(function(d) {
  var card = document.getElementById("data-progress-card");
  if (!card || !d.ok) return;
  card.style.display = "block";
  var idx = d.index || {}, p = d.price || {}, v = d.supply || {};
  var ms = d.market_snapshot || {}, mr = d.monitor_rank || {};
  var rows = [
    ["大盘指数", (idx.rows || 0) + " 条 · " + _dpFmt(idx.start) + " ~ " + _dpFmt(idx.end)],
    ["价格K线", (p.items || 0) + " 个物品 · " + (p.rows || 0) + " 条 · 中位 " + (p.median_days || 0) + " 天 · 90日覆盖 " + (p.pct_90d || 0) + "%"],
    ["在售量覆盖", (v.items_with_supply || 0) + " 个物品 · " + (v.rows || 0) + " 条 · 均 " + (v.avg_days_per_item || 0) + " 天/品 · 最近 " + _dpFmt(v.latest)],
    ["全市场快照", (ms.days || 0) + " 天 " + "·" + " " + (ms.n || 0) + " 品 " + "·" + " 最近 " + _dpFmt(ms.latest)],
    ["大户集中度", (mr.days || 0) + " 天 " + "·" + " " + (mr.n || 0) + " 品 " + "·" + " 最近 " + _dpFmt(mr.latest)]
  ];
  var html = '<table style="width:100%;font-size:13px;"><tbody>' + rows.map(function(r) {
    return '<tr><td style="width:130px;color:var(--text-muted);padding:4px 0;">' + r[0] + '</td><td style="padding:4px 0;">' + r[1] + '</td></tr>';
  }).join("") + '</tbody></table>';
  html += '<div style="margin-top:10px;font-size:11px;color:var(--text-secondary);">在售量覆盖目标 90 天/品 —— 供给数据积累主线（在售量驱动引擎，覆盖到位解锁完整供给回测）</div>';
  // ---- 信号族样本深度 (J-3, 2026-08-06): 信号数/独立事件数随采集增长 + J-2 重拟合门槛 ----
  var fam = d.families;
  if (fam && fam.display_keys) {
    var dk = fam.display_keys;
    function _dk(key, field) { return dk[key] ? (dk[key][field] != null ? dk[key][field] : "-") : "-"; }
    function _dkLatest(key) { var r = dk[key] && dk[key].date_range; return (r && r[1]) ? r[1] : "-"; }
    var famRows = [
      ["恐慌族(共振+退潮)", _dk("panic","n") + " 信号 · " + _dk("panic","events") + " 次独立事件 · 最近 " + _dkLatest("panic")],
      ["深值·大盘企稳", _dk("deep_value","n") + " 信号 · " + _dk("deep_value","events") + " 次独立事件 · 最近 " + _dkLatest("deep_value")],
      ["吸筹族(供给收缩等)", _dk("accumulate","n") + " 信号 · " + _dk("accumulate","events") + " 次独立事件 · 最近 " + _dkLatest("accumulate")]
    ];
    html += '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:8px;">'
      + '<div style="color:var(--text-muted);font-size:12px;margin-bottom:4px;">信号族样本深度（K-2 回放 ' + (fam.total_signals || 0) + ' 信号 · ' + _dpFmt(fam.generated) + ' 口径）</div>'
      + '<table style="width:100%;font-size:12px;"><tbody>' + famRows.map(function(r) {
        return '<tr><td style="width:130px;color:var(--text-muted);padding:2px 0;">' + r[0] + '</td><td style="padding:2px 0;">' + r[1] + '</td></tr>';
      }).join("") + '</tbody></table>'
      + '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">重拟合门槛(J-2)：恐慌独立事件需 ≥3（当前 ' + _dk("panic","events") + '）+ 2~3 个中性回升段 —— 随每日采集增长</div></div>';
  }
  document.getElementById("data-progress-body").innerHTML = html;
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}CS-Market 大盘{% endblock %}

{% block content %}
<div id="dashboard-content" class="page-dashboard">
{% include "partials/index_card.html" %}
{% include "partials/index_analysis.html" %}
</div>

<div class="card" style="margin-top:12px;" id="index-chart-card">
  <div class="card-header">
    <span class="card-title">📈 指数走势与引擎买入信号</span>
    <span class="card-subtitle" style="font-size:12px;color:var(--text-muted);">绿点 = 引擎历史买入信号（回测口径）</span>
  </div>
  <div id="index-chart" style="width:100%;height:320px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
(function() {
  var chartEl = document.getElementById('index-chart');
  if (!chartEl || typeof echarts === 'undefined') { return; }
  var chart = echarts.init(chartEl);
  var data = {{ chart_json|safe }};
  var markers = {{ markers_json|safe }};
  chart.setOption({
    grid: {left:50, right:20, top:24, bottom:30},
    tooltip: {trigger:'axis'},
    xAxis: {type:'category', data: data.map(function(d){return d[0];})},
    yAxis: {type:'value', scale:true},
    series: [
      {name:'指数', type:'line', data: data.map(function(d){return d[1];}), showSymbol:false, lineStyle:{width:2, color:'#6366f1'}, areaStyle:{opacity:0.08, color:'#6366f1'}},
      {name:'买入信号', type:'scatter', data: markers, symbolSize:16, itemStyle:{color:'#10b981', borderColor:'#fff', borderWidth:2}}
    ]
  });
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
{% endblock %}

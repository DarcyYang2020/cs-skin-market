{% if sectors %}
<div class="card" id="sectors-card">
  <div class="card-header">
    <span class="card-title">📮 板块资金流向</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>排名</th><th>板块</th><th>涨跌幅</th><th>趋势</th></tr>
      </thead>
      <tbody>
        {% for s in sectors %}
        <tr>
          <td style="color: var(--text-muted);">#{{ s.rank }}</td>
          <td>{{ s.name }}</td>
          <td class="{{ 'up' if s.change_pct > 0 else ('down' if s.change_pct < 0 else 'neutral') }}">
            {{ "%+.2f%%"|format(s.change_pct) }}
          </td>
          <td style="color: var(--text-muted);">{{ s.momentum }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% else %}
<div class="card" id="sectors-card">
  <div class="empty-state">
    <div class="icon">📮</div>
    <h3>暂无板块数据</h3>
    <p>点击上方「刷新数据」获取最新板块资金流向</p>
  </div>
</div>
{% endif %}
